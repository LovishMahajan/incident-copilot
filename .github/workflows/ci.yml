# Artifact 13.7: the checks on every pull request, in order, stopping at the first failure.
# Actions are pinned by commit SHA; the comment names the release.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash # -eo pipefail, so a piped command still fails the step

env:
  UV_VERSION: "0.12.6"
  PYTHON_VERSION: "3.12"
  # tests/security skips in a default run on 2026-11-19. A new skip there fails the build
  # (Artifact 13.4, M0 security gate); lower this when a skip is removed.
  SECURITY_SKIPS_ALLOWED: "10"

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # No path filter: tests read the Artifact 7 and 12 markdown under docs/.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Lockfile is current
        run: uv lock --check
      - name: Install
        run: uv sync --python "$PYTHON_VERSION" --locked
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Types, strict and blocking on the M0 and M1 modules
        # Exactly the modules named in pyproject.toml's strict override (a directory stands for
        # `pkg` and `pkg.*`); tests/unit/test_strict_paths.py fails if the two lists drift.
        # Imports are followed for types but not reported.
        run: |
          uv run mypy --follow-imports=silent \
            src/aisre/config.py src/aisre/cli.py src/aisre/notify \
            src/aisre/reliability/otlp.py src/aisre/reliability/audit_jobs.py \
            src/aisre/reliability/temporal_telemetry.py \
            src/aisre/record src/aisre/api \
            src/aisre/workflow/relay.py src/aisre/workflow/worker.py \
            src/aisre/workflow/record_activities.py src/aisre/workflow/scripted.py \
            src/aisre/gateway/ledger.py src/aisre/gateway/transport.py \
            src/aisre/gateway/jobs.py src/aisre/workflow/budget_jobs.py \
            src/aisre/evidence src/aisre/retrieval/corpus.py src/aisre/agent/skills \
            src/aisre/evaluation/seed.py src/aisre/evaluation/runner.py \
            src/aisre/remediation/test_runner.py src/aisre/remediation/review.py \
            src/aisre/remediation/release.py src/aisre/workflow/approval_activities.py \
            src/aisre/remediation/dispatcher_process.py src/aisre/verification/verifier.py \
            src/aisre/workflow/reconciliation.py
      - name: Types, report-only on src
        run: |
          set +e
          uv run mypy src | tee mypy.log
          { echo "### mypy src (report-only)"; echo; echo '```'; tail -n 1 mypy.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Tests
        run: uv run pytest -q -rs | tee pytest.log
      - name: Report skips
        if: always()
        run: |
          [ -f pytest.log ] || exit 0
          {
            echo "### Skipped tests"
            echo
            grep '^SKIPPED' pytest.log | sed 's/^/- /' || echo "None."
          } >> "$GITHUB_STEP_SUMMARY"
          n=$(awk -F'[][]' '/^SKIPPED \[[0-9]+\] tests\/security\// {s += $2} END {print s + 0}' pytest.log)
          echo "tests/security skips: $n (allowed $SECURITY_SKIPS_ALLOWED)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$n" -le "$SECURITY_SKIPS_ALLOWED" ]

  schema:
    name: Migrations and schema tests on PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 16 is the Technical specification's target; 17 is what Compose runs.
        postgres: ["16.16", "17.12"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          # Throwaway CI database on the runner's private network: no password to keep.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the server's own psql
        run: echo "PSQL=docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -q" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install
        run: uv sync --python "$PYTHON_VERSION" --locked
      - name: Create the owner role and database (schema.sql header)
        run: |
          $PSQL -U postgres -c "CREATE ROLE aisre_owner LOGIN CREATEROLE"
          $PSQL -U postgres -c "CREATE DATABASE aisre OWNER aisre_owner"
      - name: Migrate from empty, as aisre_owner
        env:
          AISRE_MIGRATION_DATABASE_URL: postgresql+psycopg://aisre_owner@127.0.0.1:5432/aisre
        run: |
          uv run alembic upgrade head
          n=$($PSQL -U postgres -d aisre -tA -c "SELECT count(*) FROM information_schema.tables
                WHERE table_schema = 'public' AND table_type = 'BASE TABLE'")
          echo "public tables: $n (expected 39)"
          [ "$n" -eq 39 ]
      - name: Run schema-tests.sql
        run: |
          $PSQL -U postgres -d aisre < db/schema-tests.sql | tee schema-tests.log
          { echo "### PostgreSQL ${{ matrix.postgres }}"; echo; tail -n 1 schema-tests.log; } >> "$GITHUB_STEP_SUMMARY"
      - name: Integration tests (Temporal joins with the Compose stack; until then those skip)
        env:
          AISRE_DATABASE_URL: postgresql+psycopg://aisre_app@127.0.0.1:5432/aisre
        run: |
          uv run pytest -q -rs -m integration | tee integration.log
          { echo; echo "Integration skips:"; grep '^SKIPPED' integration.log | sed 's/^/- /' || echo "None."; } >> "$GITHUB_STEP_SUMMARY"
      - name: Downgrade to empty and upgrade again
        env:
          AISRE_MIGRATION_DATABASE_URL: postgresql+psycopg://aisre_owner@127.0.0.1:5432/aisre
        run: uv run alembic downgrade base && uv run alembic upgrade head

  prompts:
    name: Merged prompt versions are unchanged
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the base commit is compared with HEAD
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install
        run: uv sync --python "$PYTHON_VERSION" --locked
      - name: No merged prompt version edited, deleted or renamed (ADR-63)
        env:
          # A pull request is compared with its target; a push with the commit before it.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            uv run python scripts/check_prompts.py
          else
            uv run python scripts/check_prompts.py --base "$BASE"
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history of the pushed commits
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          # An organisation account also needs GITLEAKS_LICENSE as a repository secret.
