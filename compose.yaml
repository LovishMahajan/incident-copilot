# Artifact 13.3: the local stack (ADR-14, ADR-51). M0 services, plus M1's (T1.1): an
# S3-compatible object store, the telemetry stack and three local fakes.
#
#   cp .env.example .env          # fake values only
#   docker compose up -d --build  # waits on health checks: PostgreSQL, Temporal, migrations, app
#   docker compose down -v        # stop and delete the volume
#
# Start order comes from health checks and one-shot jobs: PostgreSQL; Temporal's schema
# (temporal-schema), then the server and its `default` namespace (temporal-namespace); the
# Incident Record's migrations as aisre_owner (migrate); then the API and the worker, each
# under the aisre_app role. Temporal keeps its own two databases on the same PostgreSQL
# instance (ADR-51). Every published port is bound to 127.0.0.1.
#
# M1 (T1.1), none of it needing a key or a network beyond this machine:
#   minio, minio-bucket   object store for bulky artifacts (ADR-57); the job creates the bucket
#   otel-collector        OTLP in; metrics out to Prometheus (Artifact 12.2)
#   prometheus            scrapes the collector and loads ops/alerts.yml (Artifact 12.3)
#   token-issuer          FAKE identity system: signs short-lived tokens; the API verifies
#                         them against its JWKS (T1.3, ops/fakes/token_issuer.py)
#   fake-provider         FAKE model provider in the Anthropic Messages API shape, scripted
#                         from ops/fakes/provider-scripts (ops/fakes/model_provider.py)
#   fake-monitoring       FAKE monitoring source serving tests/fixtures scenarios
#                         (ops/fakes/monitoring.py)
# The fakes are for local use only: anyone who reaches the issuer can mint any identity.
#
# Images are pinned by tag, checked on Docker Hub on 2026-11-18. Artifact 13.3 asks for
# digests; tags are what this pass verified, and digests replace them before M0 closes.
# MinIO no longer publishes images to Docker Hub or anonymously to Quay (checked 2026-11-18),
# so the object store is MinIO from Bitnami's frozen legacy repository, the last pullable
# build. It is local only; replacing it (RustFS, SeaweedFS or a hosted store) is an open item.
name: aisre

x-fake: &fake
  image: python:3.12.14-slim
  user: "65534:65534"
  volumes:
    - ./ops/fakes:/opt/fakes:ro
  restart: unless-stopped

x-app: &app
  build: .
  image: aisre-app:dev
  depends_on:
    postgres:
      condition: service_healthy
    temporal:
      condition: service_healthy
    # Also lets `docker compose up --wait` count this one-shot job's exit as success.
    temporal-namespace:
      condition: service_completed_successfully
    migrate:
      condition: service_completed_successfully
    # The object store's bucket exists before anything can write an artifact (T1.1).
    minio-bucket:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:17.12
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      AISRE_OWNER_PASSWORD: ${AISRE_OWNER_PASSWORD:?copy .env.example to .env}
      AISRE_APP_PASSWORD: ${AISRE_APP_PASSWORD:?copy .env.example to .env}
      AISRE_DISPATCHER_PASSWORD: ${AISRE_DISPATCHER_PASSWORD:?copy .env.example to .env}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:?copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/compose/postgres-init.sh:/docker-entrypoint-initdb.d/10-aisre.sh:ro
    ports:
      - "127.0.0.1:${AISRE_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      # Over TCP: during first-start initialisation the server listens on its socket only,
      # so this stays unhealthy until the init script has created the roles and databases.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "aisre"]
      interval: 2s
      timeout: 5s
      retries: 30

  temporal-schema:
    image: temporalio/admin-tools:1.32.2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_PLUGIN: postgres12
      SQL_HOST: postgres
      SQL_PORT: "5432"
      SQL_USER: temporal
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD}
    entrypoint: ["sh", "-euc"]
    # setup-schema -v 0.0 only adds the versioning tables, so a rerun is harmless;
    # update-schema then brings each database to the version this tool ships.
    command:
      - |
        for db in temporal:temporal temporal_visibility:visibility; do
          name=$${db%%:*}; dir=$${db##*:}
          temporal-sql-tool --db "$$name" setup-schema -v 0.0
          temporal-sql-tool --db "$$name" update-schema -d "/etc/temporal/schema/postgresql/v12/$$dir/versioned"
        done
    restart: "no"

  temporal:
    image: temporalio/server:1.32.2
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD}
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/aisre.yaml
    volumes:
      - ./ops/compose/temporal-dynamicconfig.yaml:/etc/temporal/config/dynamicconfig/aisre.yaml:ro
    ports:
      - "127.0.0.1:${AISRE_TEMPORAL_PORT:-7233}:7233"
    healthcheck:
      # The frontend's HTTP API answers for the `default` namespace: the server is up and
      # temporal-namespace has run.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$(hostname):7243/api/v1/namespaces/default"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  temporal-namespace:
    image: temporalio/admin-tools:1.32.2
    depends_on:
      temporal:
        condition: service_started
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    entrypoint: ["sh", "-euc"]
    command:
      - |
        for i in $$(seq 60); do
          temporal operator namespace describe -n default >/dev/null 2>&1 && exit 0
          temporal operator namespace create -n default >/dev/null 2>&1 && exit 0
          sleep 2
        done
        echo "namespace default not created" >&2; exit 1
    restart: "no"

  temporal-ui:
    image: temporalio/ui:2.58.1
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:${AISRE_TEMPORAL_UI_PORT:-8233}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$$(hostname):8080/"]
      interval: 3s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AISRE_MIGRATION_DATABASE_URL: ${AISRE_MIGRATION_DATABASE_URL}
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    environment:
      AISRE_ENV: ${AISRE_ENV:-development}
      AISRE_DATABASE_URL: ${AISRE_DATABASE_URL}
      AISRE_LOG_LEVEL: ${AISRE_LOG_LEVEL:-INFO}
      # Bearer tokens from the fake issuer (T1.3). With these set, the development caller
      # header is refused.
      AISRE_OIDC_ISSUER: ${AISRE_OIDC_ISSUER:-}
      AISRE_OIDC_AUDIENCE: ${AISRE_OIDC_AUDIENCE:-}
      AISRE_OIDC_JWKS_URL: ${AISRE_OIDC_JWKS_URL:-}
    command:
      ["uvicorn", "--factory", "aisre.api.app:create_app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${AISRE_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 20

  worker:
    <<: *app
    environment:
      AISRE_ENV: ${AISRE_ENV:-development}
      AISRE_DATABASE_URL: ${AISRE_DATABASE_URL}
      AISRE_TEMPORAL_ADDRESS: ${AISRE_TEMPORAL_ADDRESS}
      AISRE_TEMPORAL_NAMESPACE: ${AISRE_TEMPORAL_NAMESPACE}
      AISRE_LOG_LEVEL: ${AISRE_LOG_LEVEL:-INFO}
      AISRE_SCRIPTED_SKILLS: ${AISRE_SCRIPTED_SKILLS:-false}
      AISRE_SCRIPTED_STEP_SECONDS: ${AISRE_SCRIPTED_STEP_SECONDS:-0}
    command: ["python", "-m", "aisre.workflow.worker"]
    healthcheck:
      # The worker touches this file after every relay pass (aisre.workflow.worker).
      test: ["CMD", "python", "-m", "aisre.workflow.worker", "--check-alive"]
      interval: 5s
      timeout: 5s
      retries: 12


  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    entrypoint: ["minio"]
    command: ["server", "/bitnami/minio/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?copy .env.example to .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?copy .env.example to .env}
    volumes:
      - objects:/bitnami/minio/data
    ports:
      - "127.0.0.1:${AISRE_MINIO_PORT:-59000}:9000"
      - "127.0.0.1:${AISRE_MINIO_CONSOLE_PORT:-59001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 20

  minio-bucket:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      BUCKET: ${AISRE_OBJECT_STORE_BUCKET:-aisre-artifacts}
      MC_CONFIG_DIR: /tmp/mc
    entrypoint: ["sh", "-euc"]
    # Idempotent: an existing bucket is left as it is. Versioning keeps overwritten objects.
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$BUCKET"
        mc version enable "local/$$BUCKET"
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./ops/compose/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${AISRE_OTLP_GRPC_PORT:-54317}:4317"
      - "127.0.0.1:${AISRE_OTLP_HTTP_PORT:-54318}:4318"
    # No health check here: the image has no shell or HTTP client. Prometheus's `up` for
    # job otel-collector shows whether it answers, and its own health_check extension
    # listens on 13133 inside the network.

  prometheus:
    image: prom/prometheus:v3.16.0
    depends_on:
      otel-collector:
        condition: service_started
    volumes:
      - ./ops/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:${AISRE_PROMETHEUS_PORT:-59090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 3s
      timeout: 5s
      retries: 20

  token-issuer:
    # Needs `cryptography`, so it runs on the application image.
    build: .
    image: aisre-app:dev
    command: ["python", "/opt/fakes/token_issuer.py"]
    environment:
      AISRE_ENV: ${AISRE_ENV:-development}
      FAKE_ISSUER_URL: ${AISRE_OIDC_ISSUER:-http://token-issuer:8080}
      FAKE_ISSUER_AUDIENCE: ${AISRE_OIDC_AUDIENCE:-aisre-api}
    volumes:
      - ./ops/fakes:/opt/fakes:ro
    ports:
      - "127.0.0.1:${AISRE_ISSUER_PORT:-59100}:8080"
    healthcheck: &fake-health
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"
      interval: 3s
      timeout: 5s
      retries: 20

  fake-provider:
    <<: *fake
    command: ["python", "/opt/fakes/model_provider.py"]
    ports:
      - "127.0.0.1:${AISRE_FAKE_PROVIDER_PORT:-59200}:8080"
    healthcheck: *fake-health

  fake-monitoring:
    <<: *fake
    command: ["python", "/opt/fakes/monitoring.py"]
    environment:
      FAKE_MONITORING_FIXTURES: /fixtures
    volumes:
      - ./ops/fakes:/opt/fakes:ro
      - ./tests/fixtures:/fixtures:ro
    ports:
      - "127.0.0.1:${AISRE_FAKE_MONITORING_PORT:-59300}:8080"
    healthcheck: *fake-health

volumes:
  pgdata:
  objects:
  promdata:
