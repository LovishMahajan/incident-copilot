# Alembic (ADR-05, Artifact 13.1). At the repository root so `uv run alembic upgrade head`
# works from there. Migrations are in db/migrations/; README.md says how to run them. The
# database URL is not here: env.py reads AISRE_MIGRATION_DATABASE_URL through aisre.config
# (the aisre_owner role).

[alembic]
script_location = %(here)s/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
