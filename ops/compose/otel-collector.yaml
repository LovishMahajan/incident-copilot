# Artifact 12.1, 12.2 (T1.1): the local OpenTelemetry collector. Processes send OTLP here;
# metrics go to Prometheus through the collector's own exporter, traces and logs to the
# collector's debug output until a trace store is chosen. Self-observability only (Artifact 12):
# nothing about customers' applications passes through this.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
