# Artifact 12.1, 12.3 (T1.1): the local Prometheus. Loads the platform's alert rules from
# ops/alerts.yml and scrapes the OpenTelemetry collector. The API and worker expose `/metrics`
# on an internal port from T1.19; their scrape jobs are added then. No Alertmanager yet (T4.6),
# so alerts show as firing in Prometheus and go nowhere.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
