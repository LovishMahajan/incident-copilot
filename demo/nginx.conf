# ADR-70: the demo viewer's web server. Serves the static page and proxies to the API and the
# FAKE token issuer by Compose service name, so the browser stays on one origin (no CORS).
#
# Read-only by construction. Every other write is refused here, before it reaches the API:
#   GET, HEAD   /v1/...                       to api
#   POST        /v1/incidents (exactly)       to api: start the reference incident
#   POST        /token                        to token-issuer: sign in as a demo persona
#   GET, HEAD   /readyz, /livez (exactly)     to api: the page's system-health box
#   GET, HEAD   the page's own files          static, from an allow list
#   anything else                             405 (a path outside the allow list is 404)
#
# Mounted at /etc/nginx/conf.d/default.conf by compose.yaml (service demo-viewer).

# Docker's embedded DNS, re-resolved so an api or issuer restart (new address) is followed.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    server_tokens off;
    charset utf-8;

    root /usr/share/nginx/html;
    client_max_body_size 64k;

    # On every response, errors included. No add_header in any location below: one there would
    # replace these instead of adding to them.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    set $api_upstream http://api:8000;
    set $issuer_upstream http://token-issuer:8080;

    # Requests reach the API as the browser sent them, minus the development caller headers
    # (the API refuses them anyway while token sign-in is configured).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Aisre-Dev-Caller "";
    proxy_set_header X-Aisre-Dev-Org "";
    proxy_set_header X-Aisre-Dev-Groups "";

    # ---------------------------------------------------------------- the page
    location = / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        try_files /index.html =404;
    }

    location ~ ^/(index\.html|app\.js|icons\.js|styles\.css|reference-alert\.json|favicon\.svg)$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        expires -1;
        try_files $uri =404;
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        return 404;
    }

    # ---------------------------------------------------------------- sign-in (FAKE issuer)
    location = /token {
        if ($request_method != POST) { return 405; }
        proxy_pass $issuer_upstream;
    }

    # ---------------------------------------------------------------- the API
    # Health probes for the sidebar's status box: reads only, no token needed.
    location = /readyz {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass $api_upstream;
    }

    location = /livez {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass $api_upstream;
    }

    # The one write: intake.
    location = /v1/incidents {
        if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
        proxy_pass $api_upstream;
    }

    # Every other /v1 path: reads only.
    location /v1/ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass $api_upstream;

        # The live timeline (SSE): pass each event on as it arrives, and keep the connection
        # open between the API's 15-second heartbeats.
        location ~ ^/v1/incidents/[^/]+/timeline/stream$ {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            proxy_pass $api_upstream;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
